name: mdslc-native

on:
  push:
    paths:
      - ".github/workflows/mdslc-native.yml"
      - "AGENTS.md"
      - "compiler/**"
      - "docs/mdslc/**"
  pull_request:
    paths:
      - ".github/workflows/mdslc-native.yml"
      - "AGENTS.md"
      - "compiler/**"
      - "docs/mdslc/**"

permissions:
  contents: read

jobs:
  clang-21-release:
    name: Clang 21.1.8 Release (${{ matrix.openblas_label }}, ${{ matrix.mlir_label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - openblas_label: OpenBLAS required
            openblas_enable: "ON"
            openblas_require: "ON"
            mlir_label: Matcore MLIR enabled
            mlir_enable: "ON"
            vector_readiness_enable: "OFF"
            default_semantic_pipeline: matcore-mlir
          - openblas_label: OpenBLAS required
            openblas_enable: "ON"
            openblas_require: "ON"
            mlir_label: Matcore MLIR disabled
            mlir_enable: "OFF"
            vector_readiness_enable: "OFF"
            default_semantic_pipeline: capture-v0
          - openblas_label: OpenBLAS explicitly disabled
            openblas_enable: "OFF"
            openblas_require: "OFF"
            mlir_label: Matcore MLIR enabled
            mlir_enable: "ON"
            vector_readiness_enable: "ON"
            default_semantic_pipeline: matcore-mlir
          - openblas_label: OpenBLAS explicitly disabled
            openblas_enable: "OFF"
            openblas_require: "OFF"
            mlir_label: Matcore MLIR disabled
            mlir_enable: "OFF"
            vector_readiness_enable: "OFF"
            default_semantic_pipeline: capture-v0

    steps:
      - uses: actions/checkout@v4

      - name: Add the official LLVM 21 repository
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list

      - name: Install the audited compiler tuple
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache \
            clang-21 \
            cmake \
            g++-multilib \
            libclang-21-dev \
            libclang-cpp21-dev \
            llvm-21-dev \
            ninja-build \
            pkg-config \
            python3 \
            rapidjson-dev
          /usr/bin/clang++-21 --version | grep -F "clang version 21.1.8"

      - name: Install the matching MLIR tuple
        if: matrix.mlir_enable == 'ON'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libmlir-21-dev \
            mlir-21-tools
          /usr/bin/mlir-opt-21 --version | grep -F "LLVM version 21.1.8"
          /usr/bin/mlir-tblgen-21 --version | grep -F "LLVM version 21.1.8"
          test -f /usr/lib/llvm-21/lib/cmake/mlir/MLIRConfig.cmake

      - name: Build the verified OpenBLAS 0.3.32 provider
        if: matrix.openblas_require == 'ON'
        env:
          OPENBLAS_VERSION: "0.3.32"
          OPENBLAS_SHA256: "f8a1138e01fddca9e4c29f9684fd570ba39dedc9ca76055e1425d5d4b1a4a766"
        run: |
          archive="${RUNNER_TEMP}/OpenBLAS-${OPENBLAS_VERSION}.tar.gz"
          source_dir="${RUNNER_TEMP}/OpenBLAS-${OPENBLAS_VERSION}-source"
          install_prefix="${RUNNER_TEMP}/OpenBLAS-${OPENBLAS_VERSION}-install"

          wget --https-only --tries=3 --output-document="${archive}" \
            "https://github.com/OpenMathLib/OpenBLAS/releases/download/v${OPENBLAS_VERSION}/OpenBLAS-${OPENBLAS_VERSION}.tar.gz"
          printf '%s  %s\n' "${OPENBLAS_SHA256}" "${archive}" \
            | sha256sum --check --strict

          install -d "${source_dir}"
          tar --extract --gzip --file="${archive}" \
            --directory="${source_dir}" --strip-components=1

          openblas_build_options=(
            CC=/usr/bin/clang-21
            HOSTCC=/usr/bin/clang-21
            BINARY=64
            INTERFACE64=0
            DYNAMIC_ARCH=0
            TARGET=GENERIC
            USE_THREAD=1
            USE_OPENMP=0
            NUM_THREADS=64
            ONLY_CBLAS=1
            NOFORTRAN=1
            NO_STATIC=1
            BUILD_SINGLE=1
          )
          make --directory="${source_dir}" --jobs=2 \
            "${openblas_build_options[@]}"
          make --directory="${source_dir}" \
            PREFIX="${install_prefix}" \
            "${openblas_build_options[@]}" install

          export PKG_CONFIG_PATH="${install_prefix}/lib/pkgconfig"
          test "$(pkg-config --modversion openblas)" = "${OPENBLAS_VERSION}"
          pkg-config --cflags --libs openblas
          nm --dynamic "${install_prefix}/lib/libopenblas.so" \
            | grep -E ' T cblas_sgemm$'
          nm --dynamic "${install_prefix}/lib/libopenblas.so" \
            | grep -E ' T openblas_set_num_threads_local$'

          {
            echo "MDSLC_CI_OPENBLAS_PREFIX=${install_prefix}"
            echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}"
            echo "LD_LIBRARY_PATH=${install_prefix}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          } >> "${GITHUB_ENV}"

      - name: Configure standalone MDSLC
        run: |
          mlir_options=(
            -DMDSLC_ENABLE_MATCORE_MLIR=${{ matrix.mlir_enable }}
            -DMDSLC_ENABLE_EXPERIMENTAL_MLIR_VECTOR_READINESS=${{ matrix.vector_readiness_enable }}
          )
          if [[ "${{ matrix.mlir_enable }}" == "ON" ]]; then
            mlir_options+=(
              -DMLIR_DIR=/usr/lib/llvm-21/lib/cmake/mlir
            )
          fi
          cmake -S compiler -B build-mdslc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang-21 \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-21 \
            -DMDSLC_CLANGXX_EXECUTABLE=/usr/bin/clang++-21 \
            -DMDSLC_ENABLE_NATIVE_FRONTEND=ON \
            -DMDSLC_ENABLE_BOOTSTRAP_FRONTEND=ON \
            -DMDSLC_ENABLE_OPENBLAS=${{ matrix.openblas_enable }} \
            -DMDSLC_REQUIRE_OPENBLAS=${{ matrix.openblas_require }} \
            -DMDSLC_DEFAULT_SEMANTIC_PIPELINE=${{ matrix.default_semantic_pipeline }} \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/llvm-21/lib/cmake/clang \
            "${mlir_options[@]}" \
            | tee build-mdslc-configure.log

          if [[ "${{ matrix.openblas_require }}" == "ON" ]]; then
            grep -E "MDSLC OpenBLAS variant: .+ via pkg-config" \
              build-mdslc-configure.log
          else
            grep -F "MDSLC OpenBLAS variant: unavailable (optional)" \
              build-mdslc-configure.log
          fi
          if [[ "${{ matrix.mlir_enable }}" == "ON" ]]; then
            grep -F "MDSLC Matcore MLIR semantic layer: exact MLIR 21.1.8" \
              build-mdslc-configure.log
          fi
          grep -F "MDSLC default semantic pipeline: ${{ matrix.default_semantic_pipeline }}" \
            build-mdslc-configure.log

      - name: Build standalone MDSLC
        run: cmake --build build-mdslc --parallel 2

      - name: Authenticate the MLIR link boundary
        if: matrix.mlir_enable == 'ON'
        run: |
          test -x build-mdslc/bin/matcore-mlir
          if ldd build-mdslc/bin/matcore-extract | grep -F libMLIR; then
            echo "Aggregate shared libMLIR leaked into matcore-extract" >&2
            exit 1
          fi
          if ldd build-mdslc/bin/matcore-mlir | grep -F libMLIR; then
            echo "Aggregate shared libMLIR leaked into matcore-mlir" >&2
            exit 1
          fi

      - name: Authenticate the configured BLAS linkage
        run: |
          if [[ "${{ matrix.openblas_require }}" == "ON" ]]; then
            ldd build-mdslc/lib/libmatcore_runtime.so \
              | grep -F "${MDSLC_CI_OPENBLAS_PREFIX}/lib/libopenblas.so.0"
          elif ldd build-mdslc/lib/libmatcore_runtime.so | grep -qi openblas; then
            echo "OpenBLAS leaked into the explicitly disabled build" >&2
            exit 1
          fi

      - name: Test standalone MDSLC
        run: |
          if [[ "${{ matrix.vector_readiness_enable }}" == "ON" ]]; then
            ctest --test-dir build-mdslc --output-on-failure -j1 \
              --no-tests=error \
              -R '^mlir\.structured\.gemm-vector-readiness-v1$'
          fi
          ctest --test-dir build-mdslc --output-on-failure -j1

  clang-21-debug-mlir:
    name: Clang 21.1.8 Debug (Matcore MLIR enabled, OpenBLAS disabled)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Add the official LLVM 21 repository
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list

      - name: Install the exact Clang and MLIR tuple
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache \
            clang-21 \
            cmake \
            g++-multilib \
            libclang-21-dev \
            libclang-cpp21-dev \
            libmlir-21-dev \
            llvm-21-dev \
            mlir-21-tools \
            ninja-build \
            pkg-config \
            python3 \
            rapidjson-dev
          /usr/bin/clang++-21 --version | grep -F "clang version 21.1.8"
          /usr/bin/mlir-opt-21 --version | grep -F "LLVM version 21.1.8"
          /usr/bin/mlir-tblgen-21 --version | grep -F "LLVM version 21.1.8"
          test -f /usr/lib/llvm-21/lib/cmake/mlir/MLIRConfig.cmake

      - name: Configure exact-MLIR Debug validation
        run: |
          cmake -S compiler -B build-mdslc-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=/usr/bin/clang-21 \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-21 \
            -DMDSLC_CLANGXX_EXECUTABLE=/usr/bin/clang++-21 \
            -DMDSLC_ENABLE_NATIVE_FRONTEND=ON \
            -DMDSLC_ENABLE_BOOTSTRAP_FRONTEND=ON \
            -DMDSLC_ENABLE_OPENBLAS=OFF \
            -DMDSLC_REQUIRE_OPENBLAS=OFF \
            -DMDSLC_ENABLE_MATCORE_MLIR=ON \
            -DMDSLC_DEFAULT_SEMANTIC_PIPELINE=matcore-mlir \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/llvm-21/lib/cmake/clang \
            -DMLIR_DIR=/usr/lib/llvm-21/lib/cmake/mlir \
            | tee build-mdslc-debug-configure.log
          grep -F "MDSLC OpenBLAS variant: unavailable (optional)" \
            build-mdslc-debug-configure.log
          grep -F "MDSLC Matcore MLIR semantic layer: exact MLIR 21.1.8" \
            build-mdslc-debug-configure.log
          grep -F "MDSLC default semantic pipeline: matcore-mlir" \
            build-mdslc-debug-configure.log

      - name: Build exact-MLIR Debug validation
        run: cmake --build build-mdslc-debug --parallel 2

      - name: Authenticate Debug linkage
        run: |
          test -x build-mdslc-debug/bin/matcore-mlir
          if ldd build-mdslc-debug/bin/matcore-extract | grep -F libMLIR; then
            echo "Aggregate shared libMLIR leaked into Debug matcore-extract" >&2
            exit 1
          fi
          if ldd build-mdslc-debug/bin/matcore-mlir | grep -F libMLIR; then
            echo "Aggregate shared libMLIR leaked into Debug matcore-mlir" >&2
            exit 1
          fi
          if ldd build-mdslc-debug/lib/libmatcore_runtime.so | grep -qi openblas; then
            echo "OpenBLAS leaked into the explicitly disabled Debug build" >&2
            exit 1
          fi

      - name: Test exact-MLIR Debug validation
        run: ctest --test-dir build-mdslc-debug --output-on-failure -j1

  clang-21-asan-ubsan-mlir:
    name: Clang 21.1.8 ASan+UBSan (Matcore MLIR enabled, OpenBLAS disabled)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Add the official LLVM 21 repository
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list

      - name: Install the exact Clang and MLIR tuple
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache \
            clang-21 \
            cmake \
            g++-multilib \
            libclang-21-dev \
            libclang-cpp21-dev \
            libclang-rt-21-dev \
            libmlir-21-dev \
            llvm-21-dev \
            mlir-21-tools \
            ninja-build \
            pkg-config \
            python3 \
            rapidjson-dev
          /usr/bin/clang++-21 --version | grep -F "clang version 21.1.8"
          /usr/bin/mlir-opt-21 --version | grep -F "LLVM version 21.1.8"
          /usr/bin/mlir-tblgen-21 --version | grep -F "LLVM version 21.1.8"
          test -f /usr/lib/llvm-21/lib/cmake/mlir/MLIRConfig.cmake

      - name: Configure exact-MLIR ASan+UBSan validation
        run: |
          cmake -S compiler -B build-mdslc-asan-ubsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=/usr/bin/clang-21 \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-21 \
            "-DCMAKE_C_FLAGS=-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
            "-DCMAKE_CXX_FLAGS=-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined \
            -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined \
            -DMDSLC_CLANGXX_EXECUTABLE=/usr/bin/clang++-21 \
            -DMDSLC_ENABLE_NATIVE_FRONTEND=ON \
            -DMDSLC_ENABLE_BOOTSTRAP_FRONTEND=ON \
            -DMDSLC_ENABLE_OPENBLAS=OFF \
            -DMDSLC_REQUIRE_OPENBLAS=OFF \
            -DMDSLC_ENABLE_MATCORE_MLIR=ON \
            -DMDSLC_DEFAULT_SEMANTIC_PIPELINE=matcore-mlir \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/llvm-21/lib/cmake/clang \
            -DMLIR_DIR=/usr/lib/llvm-21/lib/cmake/mlir \
            | tee build-mdslc-asan-ubsan-configure.log
          grep -F "MDSLC OpenBLAS variant: unavailable (optional)" \
            build-mdslc-asan-ubsan-configure.log
          grep -F "MDSLC Matcore MLIR semantic layer: exact MLIR 21.1.8" \
            build-mdslc-asan-ubsan-configure.log
          grep -F "MDSLC default semantic pipeline: matcore-mlir" \
            build-mdslc-asan-ubsan-configure.log

      - name: Build exact-MLIR ASan+UBSan validation
        run: cmake --build build-mdslc-asan-ubsan --parallel 2

      - name: Authenticate ASan+UBSan linkage
        run: |
          test -x build-mdslc-asan-ubsan/bin/matcore-mlir
          if ldd build-mdslc-asan-ubsan/lib/libmatcore_runtime.so | grep -qi openblas; then
            echo "OpenBLAS leaked into the explicitly disabled ASan+UBSan build" >&2
            exit 1
          fi

      - name: Test focused in-process ASan+UBSan scope
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          sanitizer_tests='^(frontend\.native\.two_gemm_region|ir\.v1\.core|mlir\.sanitizer\.allocator-protocol|mlir\.semantic\.(core|map-domain|recovered-gemm|two-gemm-region)|mlir\.cpu\.runtime_dispatch_lowering_v1|platform\.fp_environment\.v1|runtime\.cpu\.(reference_types|packed_avx2|packed_avx512|execution_context\.v1|parallel_packed\.v1|planner_v3_resources|workspace_v1|openblas_adapter|variant_conformance\.v1|gemm_v0)|runtime\.c_abi\.(typed_reference_v1|compatibility_v1|fp_environment_v1|region_guard_oracles_v1|public_context_v1))$'
          ctest --test-dir build-mdslc-asan-ubsan -N -R "${sanitizer_tests}" \
            | tee build-mdslc-asan-ubsan/focused-test-list.txt
          grep -F "Total Tests: 24" \
            build-mdslc-asan-ubsan/focused-test-list.txt
          ctest --test-dir build-mdslc-asan-ubsan --output-on-failure -j1 \
            -R "${sanitizer_tests}"

  clang-21-tsan-runtime:
    name: Clang 21.1.8 TSan runtime (Matcore MLIR and OpenBLAS disabled)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Add the official LLVM 21 repository
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list

      - name: Install the exact Clang tuple
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-21 \
            cmake \
            libclang-rt-21-dev \
            ninja-build \
            python3 \
            rapidjson-dev
          /usr/bin/clang++-21 --version | grep -F "clang version 21.1.8"

      - name: Configure focused TSan runtime validation
        run: |
          cmake -S compiler -B build-mdslc-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=/usr/bin/clang-21 \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-21 \
            "-DCMAKE_C_FLAGS=-O1 -g -fsanitize=thread -fno-omit-frame-pointer" \
            "-DCMAKE_CXX_FLAGS=-O1 -g -fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread \
            -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread \
            -DMDSLC_CLANGXX_EXECUTABLE=/usr/bin/clang++-21 \
            -DMDSLC_ENABLE_NATIVE_FRONTEND=OFF \
            -DMDSLC_ENABLE_BOOTSTRAP_FRONTEND=ON \
            -DMDSLC_ENABLE_OPENBLAS=OFF \
            -DMDSLC_REQUIRE_OPENBLAS=OFF \
            -DMDSLC_ENABLE_MATCORE_MLIR=OFF \
            -DMDSLC_DEFAULT_SEMANTIC_PIPELINE=capture-v0 \
            | tee build-mdslc-tsan-configure.log
          grep -F "MDSLC OpenBLAS variant: unavailable (optional)" \
            build-mdslc-tsan-configure.log
          grep -F "MDSLC default semantic pipeline: capture-v0" \
            build-mdslc-tsan-configure.log

      - name: Build focused TSan runtime validation
        run: |
          cmake --build build-mdslc-tsan --parallel 2 --target \
            matcore_execution_context_test \
            matcore_parallel_packed_gemm_test \
            matcore_planner_v3_resources_test \
            matcore_public_context_c_api_test

      - name: Test exact TSan runtime scope
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          tsan_tests='^runtime\.(cpu\.(execution_context\.v1|parallel_packed\.v1|planner_v3_resources)|c_abi\.public_context_v1)$'
          ctest --test-dir build-mdslc-tsan -N -R "${tsan_tests}" \
            | tee build-mdslc-tsan/focused-test-list.txt
          grep -F "Total Tests: 4" build-mdslc-tsan/focused-test-list.txt
          ctest --test-dir build-mdslc-tsan --output-on-failure -j1 \
            -R "${tsan_tests}"
